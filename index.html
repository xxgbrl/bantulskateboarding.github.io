<!DOCTYPE html>

<link rel="canonical" href="https://bantulskateboarding.my.id/" />

<link rel="preconnect" href="https://fonts.googleapis.com" />

<body>

<header class="site-header">

      <div class="btns" id="hero-btns"></div>

<footer class="site-footer">

    <img id="logo2" src="images/logo.png" alt="Bantul Skateboarding" width="60" height="34">
