<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bantul Skateboarding – Komunitas Skateboard Independen dari Bantul, Yogyakarta</title>
<link rel="icon" href="images/logo.png" />
<meta name="description" content="Bantul Skateboarding adalah komunitas skateboard independen yang dibentuk tahun 2017 di Bantul, Yogyakarta. Lihat kegiatan, prestasi anggota, riwayat event, dan cara menghubungi kami." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Bantul Skateboarding" />
<meta property="og:description" content="Tak peduli latar belakang, di atas papan kita semua setara dan bersaudara." />
<meta property="og:url" content="https://bantulskateboarding.my.id/" />
<meta property="og:image" content="images/hero.jpg">
<meta name="theme-color" content="#0e0e0e" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0e0e0e; --card:#242424; --card2:#2e2e2e; --ink:#f2f0ea; --mute:#b4b1a8; --hot:#ff5a3c; --sun:#ffb347;
  --head:"Chivo Mono",ui-monospace,Menlo,Consolas,monospace;
  --body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.7;font-size:1.0625rem}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 1.25rem}
h2{font-family:var(--head);font-weight:700;font-size:clamp(2.1rem,6vw,3.6rem);line-height:1.02;letter-spacing:-.03em;margin-bottom:1.5rem}
h3{font-family:var(--head);font-weight:700}
section{padding:4.5rem 0}
p+p{margin-top:1rem}
.mute{color:var(--mute)}
.photo{border-radius:var(--r);object-fit:cover;width:100%;background:var(--card)}

/* Header */
header{position:sticky;top:0;z-index:20;background:rgba(14,14,14,.94);backdrop-filter:blur(8px);border-bottom:1px solid #2a2a2a}
header .wrap{display:flex;align-items:center;gap:1.5rem;padding-top:.5rem;padding-bottom:.5rem}
header img{height:38px;width:auto;flex:none}
nav{overflow-x:auto;scrollbar-width:none}
nav ul{display:flex;gap:1.4rem;list-style:none;white-space:nowrap}
nav a{text-decoration:none;font-size:.95rem;color:var(--mute);padding:.4rem 0;display:inline-block;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink);border-bottom-color:var(--hot)}

/* Hero */
.hero{position:relative;min-height:88vh;display:flex;align-items:flex-end;padding:0;background:#000 url("images/hero.jpg") center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(14,14,14,1) 4%,rgba(14,14,14,.55) 42%,rgba(14,14,14,.1) 75%)}
.hero .wrap{position:relative;padding-bottom:3.5rem;padding-top:8rem}
.hero h1{font-family:var(--head);font-weight:700;font-size:clamp(2.6rem,9.5vw,7rem);line-height:.95;letter-spacing:-.04em;max-width:11ch}
.hero p{font-size:clamp(1.05rem,2.4vw,1.4rem);max-width:30rem;margin-top:1.25rem}
.btns{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.75rem}
.btn{display:inline-block;padding:.8rem 1.4rem;border-radius:999px;font-weight:700;text-decoration:none;background:var(--ink);color:var(--bg);border:2px solid var(--ink)}
.btn:hover{background:var(--sun);border-color:var(--sun)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--bg)}

/* Dua kolom */
.two{display:grid;gap:2.5rem;grid-template-columns:1fr;align-items:center}
@media(min-width:860px){.two{grid-template-columns:1fr 1fr}.two.wide-l{grid-template-columns:.8fr 1.2fr}}
.about .photo{aspect-ratio:4/3.2}

/* Visi Misi */
.vm{background:#141414}
.vm h3{font-size:1.25rem;margin-bottom:.5rem}
.vm ul{list-style:none}
.vm li{padding:1rem 0;border-top:1px solid #333}
.vm .block+.block{margin-top:2.5rem}

/* Kegiatan */
.cards{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.act{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3.4;background:var(--card)}
.act img{width:100%;height:100%;object-fit:cover}
.act figcaption{position:absolute;inset:0 0 auto 0;padding:.9rem;display:flex;align-items:center;gap:.6rem;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}
.pill{font-size:.78rem;background:rgba(255,255,255,.22);padding:.15rem .7rem;border-radius:999px;backdrop-filter:blur(4px)}
.act b{font-size:1.05rem}
.intro{max-width:44rem;margin-bottom:2rem}

/* Prestasi */
.ach{background:#141414}
.who{display:grid;gap:1.5rem;grid-template-columns:1fr;margin-top:3rem;align-items:start}
@media(min-width:860px){.who{grid-template-columns:.8fr 1.2fr}}
.who h3{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:1rem}
.who .photo{aspect-ratio:5/4}
.res{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.res div{background:var(--card);border-radius:16px;padding:1rem 1.1rem}
.res strong{display:block;font-size:1.3rem;line-height:1.2}
.res span{display:block;font-size:.92rem;color:var(--mute)}
.res b{font-weight:700;color:var(--ink);display:block;margin-top:.35rem}
.res .win strong{color:var(--sun)}

/* Struktur */
.org{display:flex;flex-direction:column;gap:1rem;align-items:flex-start}
.row{display:flex;flex-wrap:wrap;gap:.75rem}
.node{background:var(--card2);border-radius:16px;padding:.75rem 1.1rem;min-width:132px}
.node small{display:inline-block;font-size:.78rem;background:rgba(255,255,255,.14);border-radius:999px;padding:0 .6rem;margin-bottom:.2rem}
.node strong{display:block;font-family:var(--head);font-size:1.15rem}
.node.top{border:2px solid var(--hot)}

/* Event */
.events{background:#141414}
ol.tl{list-style:none;columns:1;column-gap:3rem;border-left:2px solid #444;padding-left:1.4rem}
@media(min-width:860px){ol.tl{columns:2}}
.tl li{break-inside:avoid;position:relative;padding-bottom:1.5rem}
.tl li::before{content:"";position:absolute;left:calc(-1.4rem - 6px);top:.55rem;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.tl b{display:block;font-size:1.1rem;line-height:1.35}
.tl span{color:var(--mute);font-size:.95rem}

/* Galeri */
.gal{columns:1;column-gap:1rem}
@media(min-width:560px){.gal{columns:2}}
@media(min-width:960px){.gal{columns:3}}
.gal img{margin-bottom:1rem;border-radius:var(--r);width:100%;break-inside:avoid;height:auto}

/* Kontak */
.contact dl{display:grid;gap:.25rem 1.5rem;grid-template-columns:auto 1fr;margin:1.25rem 0 2rem}
.contact dt{color:var(--mute)}
.contact a{text-underline-offset:4px}
.contact h3{font-size:1.2rem;margin-top:1.5rem}
.contact .photo{aspect-ratio:4/4.4}

footer{padding:2rem 0;border-top:1px solid #2a2a2a;color:var(--mute);font-size:.92rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.75rem;align-items:center}
footer img{height:34px;width:auto}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="#beranda"><img id="logo" src="images/logo.png" alt="Bantul Skateboarding" width="60" height="34"></a>
    <nav aria-label="Menu utama"><ul id="nav-list"></ul></nav>
  </div>
</header>

<!-- Kerangka halaman. ISI semua section diatur lewat CMS (folder /data), jangan edit teks di sini. -->
<main id="beranda">
  <div class="hero" id="hero">
    <div class="wrap">
      <h1 id="hero-title"></h1>
      <p id="hero-sub"></p>
      <div class="btns" id="hero-btns"></div>
    </div>
  </div>
  <section id="tentang" class="about"><div class="wrap two" id="about"></div></section>
  <section id="visi" class="vm"><div class="wrap two" id="vision"></div></section>
  <section id="kegiatan"><div class="wrap" id="activities"></div></section>
  <section id="prestasi" class="ach"><div class="wrap" id="achievements"></div></section>
  <section id="struktur"><div class="wrap two" id="structure"></div></section>
  <section id="event" class="events"><div class="wrap" id="events"></div></section>
  <section id="galeri"><div class="wrap" id="gallery"></div></section>
  <section id="kontak" class="contact" style="background:#141414"><div class="wrap two" id="contact"></div></section>
</main>

<footer>
  <div class="wrap">
    <img id="logo2" src="images/logo.png" alt="Bantul Skateboarding" width="60" height="34">
    <p id="footer-text"></p>
  </div>
</footer>

<script>
/* Semua konten dibaca dari folder /data (diedit lewat Pages CMS). */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const src=p=>esc(String(p||"").replace(/^\/+/,""));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");   // **tebal** + baris baru
const paras=a=>(a||[]).map(t=>`<p>${fmt(t)}</p>`).join("");
const sup=s=>s.replace(/^(\d)(st|nd|rd|th)(.*)$/,"$1<sup>$2</sup>$3");
const isUrl=h=>/^https?:/.test(h);
const load=n=>fetch("data/"+n+".json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(n+" "+r.status);return r.json()});
const $=id=>document.getElementById(id);
const run=(n,fn)=>load(n).then(fn).catch(e=>console.error("Gagal memuat data/"+n+".json",e));

run("site",d=>{
  if(d.logo){["logo","logo2"].forEach(i=>{$(i).src=src(d.logo)})}
  if(d.logo_alt){["logo","logo2"].forEach(i=>{$(i).alt=d.logo_alt})}
  $("footer-text").textContent=d.footer_text||"";
});

run("nav",d=>{$("nav-list").innerHTML=(d.items||[]).map(i=>`<li><a href="${esc(i.href)}"${isUrl(i.href)?' target="_blank" rel="noopener"':""}>${esc(i.label)}</a></li>`).join("")});

run("home",d=>{
  $("hero-title").textContent=d.title||"";
  $("hero-sub").textContent=d.subtitle||"";
  if(d.image)$("hero").style.backgroundImage=`url("${encodeURI(String(d.image).replace(/^\/+/,"")).replace(/"/g,"%22")}")`;
  $("hero-btns").innerHTML=(d.buttons||[]).map(b=>`<a class="btn${b.style==="line"?" line":""}" href="${esc(b.href)}"${isUrl(b.href)?' target="_blank" rel="noopener"':""}>${esc(b.label)}</a>`).join("");
});

run("about",d=>{$("about").innerHTML=`<div><h2>${fmt(d.heading)}</h2>${paras(d.paragraphs)}</div><img class="photo" src="${src(d.image)}" alt="${esc(d.alt)}" loading="lazy">`});

run("vision",d=>{$("vision").innerHTML=`<h2>${fmt(d.heading)}</h2><div>
  <div class="block"><h3>+ Vision</h3><p>${fmt(d.vision)}</p></div>
  <div class="block"><h3>+ Mission</h3><ul>${(d.missions||[]).map(m=>`<li>${fmt(m)}</li>`).join("")}</ul></div></div>`});

run("activities",d=>{$("activities").innerHTML=`<h2>${fmt(d.heading)}</h2><div class="intro">${paras(d.intro)}</div><div class="cards">${(d.items||[]).map(a=>
  `<figure class="act"><img src="${src(a.image)}" alt="${esc(a.alt)}" loading="lazy"${a.focus==="top"?' style="object-position:top"':""}><figcaption><span class="pill">${esc(a.type)}</span><b>${esc(a.title)}</b></figcaption></figure>`).join("")}</div>`});

run("athletes",d=>{$("achievements").innerHTML=`<div class="two wide-l"><div><h2>${fmt(d.heading)}</h2>${paras(d.intro)}</div><img class="photo" src="${src(d.image)}" alt="${esc(d.alt)}" loading="lazy" style="aspect-ratio:4/3;object-position:center 20%"></div>
  <div>${(d.items||[]).map(a=>`
   <div class="who">
    <div><h3>${esc(a.name)}’s Achievements</h3><img class="photo" src="${src(a.image)}" alt="${esc(a.alt)}" loading="lazy"></div>
    <div class="res">${(a.results||[]).map(x=>{const p=esc(x.place);return `<div class="${p.startsWith("1")?"win":""}"><strong>${sup(p)}${/^\d/.test(p)?" Place":""}</strong><b>${esc(x.category)}</b><span>${[x.event,x.year].filter(Boolean).map(esc).join(" · ")}</span></div>`}).join("")}</div>
   </div>`).join("")}</div>`});

run("structure",d=>{$("structure").innerHTML=`<div><h2>${fmt(d.heading)}</h2><p>${fmt(d.text)}</p></div><div class="org">${(d.rows||[]).map(r=>
  `<div class="row">${(r.members||[]).map(m=>`<div class="node${m.featured?" top":""}"><small>${esc(m.role)}</small><strong>${esc(m.name)}</strong></div>`).join("")}</div>`).join("")}</div>`});

run("events",d=>{$("events").innerHTML=`<h2>${fmt(d.heading)}</h2><div class="intro">${paras(d.intro)}</div><ol class="tl">${(d.items||[]).map(e=>
  `<li><b>${esc(e.title)}</b><span>${[e.place,e.date].filter(Boolean).map(esc).join(" · ")}</span></li>`).join("")}</ol>`});

run("gallery",d=>{$("gallery").innerHTML=`<h2>${fmt(d.heading)}</h2><div class="gal">${(d.items||[]).map(g=>`<img src="${src(g.image)}" alt="${esc(g.alt)}" loading="lazy">`).join("")}</div>`});

run("contact",d=>{
  const num=String(d.whatsapp_number||"").replace(/\D/g,"");
  const wa=t=>`https://wa.me/${num}?text=${encodeURIComponent(t||"")}`;
  const ig=String(d.person_instagram||"").replace(/^@/,"");
  const ext=u=>`href="${esc(u)}" target="_blank" rel="noopener"`;
  $("contact").innerHTML=`<div><h2>${fmt(d.heading)}</h2>
   <h3>Media sosial komunitas</h3>
   <dl>${(d.socials||[]).map(s=>`<dt>${esc(s.platform)}</dt><dd>${(s.accounts||[]).map(a=>`<a ${ext(a.url)}>${esc(a.handle)}</a>`).join("<br>")}</dd>`).join("")}</dl>
   <h3>Contact person</h3>
   <dl>
     <dt>Nama</dt><dd>${esc(d.person_name)}</dd>
     ${ig?`<dt>Instagram</dt><dd><a ${ext("https://instagram.com/"+ig)}>@${esc(ig)}</a></dd>`:""}
     ${num?`<dt>WhatsApp</dt><dd><a ${ext(wa(d.whatsapp_greeting))}>${esc(d.whatsapp_display||"+"+num)}</a></dd>`:""}
   </dl>
   ${num?`<a class="btn" ${ext(wa(d.button_message))}>${esc(d.button_label||"Chat lewat WhatsApp")}</a>`:""}
  </div><img class="photo" src="${src(d.image)}" alt="${esc(d.alt)}" loading="lazy">`;
});
</script>
</body>
</html>
